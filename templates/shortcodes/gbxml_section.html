<div class="gbx plen adj open" id="gbx-{{ id | default(value='a') }}">
  <div class="gbx-top">
    <h3>What the exporter does to the geometry</h3>
    <p>A two-story section on the left, the gbXML it writes on the right. Toggle the pieces that Revit's own export gets wrong and watch both update.</p>
  </div>

  <div class="gbx-controls">
    <label><input type="checkbox" data-t="adj" checked> Pair interior surfaces (adjacency)</label>
    <label><input type="checkbox" data-t="plen" checked> Synthesize plenum in the floor gap</label>
    <label><input type="checkbox" data-t="open" checked> Position opening in the surface frame</label>
  </div>

  <div class="gbx-body">
    <svg class="gbx-svg" viewBox="0 0 480 340" role="img" aria-label="Building section">
      <rect x="0" y="0" width="480" height="340" fill="#0b1220"/>
      <!-- rooms -->
      <rect x="60" y="40" width="360" height="90" fill="#1d3a5f" stroke="#6ea8fe" stroke-width="1.5"/>
      <rect x="60" y="175" width="360" height="115" fill="#1d3a5f" stroke="#6ea8fe" stroke-width="1.5"/>
      <text x="72" y="60" class="gbx-lbl">Room 201</text>
      <text x="72" y="195" class="gbx-lbl">Room 101</text>
      <!-- exterior walls -->
      <rect x="52" y="40" width="8" height="250" fill="#3b5578"/>
      <rect x="420" y="40" width="8" height="250" fill="#3b5578"/>

      <!-- plenum gap: off = unresolved, on = synthesized -->
      <g class="v plen-off">
        <rect x="60" y="130" width="360" height="45" fill="url(#gbx-hatch-{{ id | default(value='a') }})" stroke="#f87171" stroke-dasharray="4 3"/>
        <text x="240" y="157" class="gbx-warn" text-anchor="middle">unresolved gap, HAP sees a hole</text>
      </g>
      <g class="v plen-on">
        <rect x="60" y="130" width="360" height="45" fill="#4a3410" stroke="#fbbf24" stroke-width="1.3"/>
        <text x="240" y="157" class="gbx-plbl" text-anchor="middle">Plenum (synthesized)</text>
      </g>

      <!-- adjacency at the two horizontal interfaces -->
      <g class="v adj-off">
        <line x1="60" y1="130" x2="420" y2="130" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="2"/>
        <line x1="60" y1="175" x2="420" y2="175" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="2"/>
        <text x="240" y="123" class="gbx-warn" text-anchor="middle">unpaired surfaces</text>
      </g>
      <g class="v adj-on">
        <line x1="60" y1="128" x2="420" y2="128" stroke="#34d399" stroke-width="2"/>
        <line x1="60" y1="132" x2="420" y2="132" stroke="#34d399" stroke-width="2"/>
        <line x1="60" y1="173" x2="420" y2="173" stroke="#34d399" stroke-width="2"/>
        <line x1="60" y1="177" x2="420" y2="177" stroke="#34d399" stroke-width="2"/>
        <text x="240" y="120" class="gbx-ok" text-anchor="middle">paired &#8593;&#8595; adjacent spaces</text>
      </g>

      <!-- opening in the right wall of Room 201 -->
      <g class="v open-on">
        <rect x="414" y="70" width="20" height="34" fill="#22d3ee" stroke="#a5f3fc" stroke-width="1.3"/>
        <text x="404" y="64" class="gbx-ok" text-anchor="end">window in frame</text>
      </g>
      <g class="v open-off">
        <rect x="414" y="70" width="20" height="34" fill="none" stroke="#f87171" stroke-dasharray="3 3"/>
        <text x="404" y="64" class="gbx-warn" text-anchor="end">opening dropped</text>
      </g>

      <defs>
        <pattern id="gbx-hatch-{{ id | default(value='a') }}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="8" stroke="#f87171" stroke-width="1.4" stroke-opacity="0.5"/>
        </pattern>
      </defs>
    </svg>

    <pre class="gbx-code" data-out="xml"></pre>
  </div>
</div>

<style>
.gbx{border:1px solid #dbe4d9;border-radius:14px;background:#fff;margin:1.5rem 0;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.gbx-top{padding:1rem 1.25rem;background:linear-gradient(135deg,#b45309,#0f766e);color:#fff}
.gbx-top h3{margin:0 0 .35rem;font-size:1.15rem}
.gbx-top p{margin:0;font-size:.9rem;opacity:.93;line-height:1.5}
.gbx-controls{display:flex;flex-wrap:wrap;gap:1rem;padding:.9rem 1.25rem;background:#f7faf6;border-bottom:1px solid #eaf0e7}
.gbx-controls label{font-size:.84rem;color:#334155;display:flex;align-items:center;gap:.4rem;cursor:pointer}
.gbx-controls input{accent-color:#0f766e;width:15px;height:15px}
.gbx-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:640px){.gbx-body{grid-template-columns:1fr}}
.gbx-svg{width:100%;height:auto;display:block;background:#0b1220}
.gbx-lbl{fill:#cfe0ff;font:600 12px system-ui}
.gbx-plbl{fill:#fcd34d;font:600 12px system-ui}
.gbx-warn{fill:#fca5a5;font:600 10.5px system-ui}
.gbx-ok{fill:#6ee7b7;font:600 10.5px system-ui}
.gbx .v{display:none}
.gbx.plen .plen-on{display:inline}
.gbx:not(.plen) .plen-off{display:inline}
.gbx.adj .adj-on{display:inline}
.gbx:not(.adj) .adj-off{display:inline}
.gbx.open .open-on{display:inline}
.gbx:not(.open) .open-off{display:inline}
.gbx-code{margin:0;background:#0b1220;color:#e2e8f0;padding:1rem;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto;border-left:1px solid #1e293b}
.gbx-code .t{color:#7dd3fc}.gbx-code .a{color:#fcd34d}.gbx-code .s{color:#86efac}.gbx-code .c{color:#64748b}.gbx-code .bad{color:#fca5a5}
</style>

<script>
(function(){
  var root=document.getElementById('gbx-{{ id | default(value="a") }}');
  if(!root) return;
  function has(c){ return root.classList.contains(c); }
  function tag(name,attrs){ return '<span class="t">&lt;'+name+'</span>'+(attrs||'')+'<span class="t">&gt;</span>'; }
  function render(){
    var L=[];
    L.push('<span class="t">&lt;Campus&gt;</span>');
    L.push('  '+tag('Space',' <span class="a">id</span>=<span class="s">"Room-201"</span> <span class="a">spaceType</span>=<span class="s">"ConditionedSpace"</span>'));
    if(has('plen')){
      L.push('  <span class="t">&lt;Space</span> <span class="a">id</span>=<span class="s">"Plenum-1"</span> <span class="a">spaceType</span>=<span class="s">"Plenum"</span><span class="t">&gt;</span>');
      L.push('    <span class="t">&lt;Area&gt;</span><span class="s">360</span><span class="t">&lt;/Area&gt;</span>  <span class="c">// synthesized</span>');
      L.push('  <span class="t">&lt;/Space&gt;</span>');
    } else {
      L.push('  <span class="c bad">&lt;!-- no plenum: 45 ft gap left unmodeled --&gt;</span>');
    }
    L.push('  '+tag('Space',' <span class="a">id</span>=<span class="s">"Room-101"</span> <span class="a">spaceType</span>=<span class="s">"ConditionedSpace"</span>'));
    L.push('');
    if(has('adj')){
      L.push('  <span class="t">&lt;Surface</span> <span class="a">id</span>=<span class="s">"S-Floor2"</span> <span class="a">surfaceType</span>=<span class="s">"InteriorFloor"</span><span class="t">&gt;</span>');
      L.push('    <span class="t">&lt;AdjacentSpaceId</span> <span class="a">spaceIdRef</span>=<span class="s">"Room-201"</span><span class="t">/&gt;</span>');
      L.push('    <span class="t">&lt;AdjacentSpaceId</span> <span class="a">spaceIdRef</span>=<span class="s">"'+(has('plen')?'Plenum-1':'Room-101')+'"</span><span class="t">/&gt;</span>');
      L.push('  <span class="t">&lt;/Surface&gt;</span>');
    } else {
      L.push('  <span class="t">&lt;Surface</span> <span class="a">id</span>=<span class="s">"S-Floor2"</span> <span class="a">surfaceType</span>=<span class="bad">"ExteriorFloor"</span><span class="t">&gt;</span>');
      L.push('    <span class="t">&lt;AdjacentSpaceId</span> <span class="a">spaceIdRef</span>=<span class="s">"Room-201"</span><span class="t">/&gt;</span>');
      L.push('    <span class="c bad">&lt;!-- second face missing: HAP can\'t pair it --&gt;</span>');
      L.push('  <span class="t">&lt;/Surface&gt;</span>');
    }
    L.push('');
    if(has('open')){
      L.push('  <span class="t">&lt;Opening</span> <span class="a">id</span>=<span class="s">"O-7"</span> <span class="a">openingType</span>=<span class="s">"OperableWindow"</span><span class="t">&gt;</span>');
      L.push('    <span class="t">&lt;PlanarGeometry&gt;</span> <span class="c">// 4 coords in the wall plane</span>');
      L.push('  <span class="t">&lt;/Opening&gt;</span>');
    } else {
      L.push('  <span class="c bad">&lt;!-- window omitted: no valid host surface frame --&gt;</span>');
    }
    L.push('<span class="t">&lt;/Campus&gt;</span>');
    root.querySelector('[data-out="xml"]').innerHTML=L.join('\n');
  }
  root.querySelectorAll('[data-t]').forEach(function(cb){
    cb.addEventListener('change',function(){ root.classList.toggle(cb.getAttribute('data-t'),cb.checked); render(); });
  });
  render();
})();
</script>
