<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 150" width="1024" height="150" role="img" aria-label="Revit MEP Transparent, abstract layered panels revealing an inner calculation grid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1024" height="150" fill="url(#bg)"/>
  <rect width="1024" height="150" fill="url(#grid)"/>
  <rect width="1024" height="150" fill="url(#glow)"/>

  <!-- incoming flow streamline with calc nodes -->
  <path d="M0,95 C140,60 260,132 400,92 S620,68 720,88" fill="none" stroke="url(#flow)" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round"/>
  <g fill="#0f172a" stroke="url(#flow)" stroke-width="1.8">
    <circle cx="150" cy="74" r="7"/>
    <circle cx="300" cy="110" r="7"/>
    <circle cx="460" cy="86" r="7"/>
    <circle cx="600" cy="74" r="7"/>
  </g>
  <!-- tiny "math" ticks -->
  <g stroke="#67e8f9" stroke-width="1.4" stroke-opacity="0.8" stroke-linecap="round">
    <path d="M228,52 h10 M233,47 v10"/>
    <path d="M378,124 l7,7 M385,124 l-7,7"/>
  </g>

  <!-- layered translucent panels: the black box opened up -->
  <g stroke-linejoin="round">
    <rect x="690" y="40" width="210" height="80" rx="10" fill="#14b8a6" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.4"/>
    <rect x="730" y="32" width="210" height="90" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.42" stroke-width="1.4"/>
    <rect x="770" y="45" width="200" height="72" rx="10" fill="#67e8f9" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.6" stroke-width="1.6"/>
  </g>
  <!-- revealed inner grid inside the front panel -->
  <g stroke="#a5f3fc" stroke-opacity="0.28" stroke-width="1">
    <path d="M810,45 V117 M850,45 V117 M890,45 V117 M930,45 V117"/>
    <path d="M770,69 H970 M770,93 H970"/>
  </g>
</svg>
